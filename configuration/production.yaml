application_host: "0.0.0.0"
application_port: 8000

# The backend's own public URL (used to build links, e.g. email confirmation).
# Replace with your Render service URL.
base_url: "https://your-backend.onrender.com"

# Production secrets & env-specific values are supplied via environment
# variables (see DEPLOYMENT.md), NOT committed here:
#   APP_HMAC_SECRET               - session cookie signing key (generate a random one)
#   APP_REDIS_URI                 - Upstash rediss:// URL (TLS)
#   APP_DATABASE__PASSWORD        - Neon database password
#   APP_EMAIL_CLIENT__AUTH_TOKEN  - Postmark server token
#   APP_FRONTEND_ORIGINS          - not settable via env (list); set below

database:
  host: "ep-super-haze-aouyox3l-pooler.c-2.ap-southeast-1.aws.neon.tech"
  port: 5432
  database_name: "blog"
  # Not a secret, so it lives here; only the password comes from the environment.
  username: "neondb_owner"
  require_ssl: true

# Exact Vercel origin(s) allowed to call the API with credentials.
# Replace with your real deployed frontend URL(s).
frontend_origins:
  - "https://your-frontend.vercel.app"

# Frontend (Vercel) and backend (Render) are on different HTTPS origins, so
# session cookies must be Secure + SameSite=None to survive cross-site auth.
cookie_secure: true

email_client:
  base_url: "https://api.postmarkapp.com"
  sender_email: "noreply@yourdomain.com"
  timeout_milliseconds: 10000
