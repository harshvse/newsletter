application_port: 8000
redis_uri: "redis://127.0.0.1:6379"
# hmac_secret is intentionally NOT set here so it is never committed with a
# real value. It is provided per-environment: local.yaml for development and
# the APP_HMAC_SECRET env var in production (fail-fast if missing).
frontend_origins: []
cookie_secure: false
database:
  host: "0.0.0.0"
  port: 5432
  username: "postgres"
  password: "password"
  database_name: "wizard_blog_backend"

email_client:
  base_url: "http://localhost:8000"
  sender_email: "test@gmail.com"
  auth_token: "test_token"
  timeout_milliseconds: 10000
