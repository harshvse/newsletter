# Local development dependencies only (Postgres + Redis).
#
# Production does NOT use this file — the backend runs on Render with managed
# Neon (Postgres) and Upstash (Redis). See ../DEPLOYMENT.md.
#
# Usage:  docker compose up -d   (then `cargo run` with APP_ENVIRONMENT=local)
services:
  postgres:
    image: postgres:16
    container_name: wizard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wizard_blog_backend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: wizard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
